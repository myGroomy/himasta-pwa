<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Student Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-primary-container": "#90a8ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdbcb",
                        "on-primary-fixed-variant": "#264191",
                        "on-primary-fixed": "#00164e",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#341100",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "primary-container": "#1e3a8a",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-tertiary-container": "#f39461",
                        "on-secondary-container": "#54647a",
                        "on-surface-variant": "#444651",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#505f76",
                        "outline-variant": "#c5c5d3",
                        "surface-tint": "#4059aa",
                        "on-surface": "#191c1e",
                        "error": "#ba1a1a",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-bright": "#f7f9fb",
                        "on-background": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#dce1ff",
                        "secondary-container": "#d0e1fb",
                        "tertiary": "#4b1c00",
                        "primary": "#00236f",
                        "background": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#b6c4ff",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#ffb691",
                        "on-error": "#ffffff",
                        "tertiary-container": "#6e2c00",
                        "outline": "#757682",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1rem",
                        "margin-mobile": "1rem",
                        "container-max": "1200px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "headline-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter md:p-8 font-body-lg text-on-background">
<!-- Linear/Transactional Page - Navigation Shell Suppressed -->
<main class="w-full max-w-md">
<!-- Minimalist Corporate Card -->
<div class="bg-surface rounded-xl border border-outline-variant p-6 md:p-8">
<!-- Header Section -->
<div class="text-center mb-8 flex flex-col items-center">
<!-- Logo Placeholdler -->
<div class="w-16 h-16 bg-primary-container rounded-lg border border-outline-variant flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                        school
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-md md:text-headline-md text-on-surface mb-2">
                    Masuk ke akun Anda
                </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Gunakan kredensial anggota Anda
                </p>
</div>
<!-- Form Section -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Input Group: NIM/Email -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="identifier">
                        NIM / Email
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface placeholder-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors min-h-touch-target-min font-body-lg text-body-lg" id="identifier" name="identifier" placeholder="Masukkan NIM atau Email" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="password">
                        Password
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface placeholder-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors min-h-touch-target-min font-body-lg text-body-lg" id="password" name="password" placeholder="Masukkan Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none focus:text-primary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-3 px-4 rounded-DEFAULT hover:bg-primary hover:text-on-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-touch-target-min flex justify-center items-center" type="submit">
                    Masuk
                </button>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline" href="/register">
                    Belum punya akun? Daftar di sini
                </a>
</div>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
