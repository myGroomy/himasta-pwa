<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->

<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed truncate px-2">Pengajuan Izin</h1>
<div class="w-12 h-12 flex items-center justify-center rounded-full overflow-hidden border border-outline-variant bg-surface-container-low cursor-pointer hover:bg-surface-container transition-colors">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A professional headshot of a college student in a crisp white shirt, minimalist corporate style, well-lit studio environment, high resolution." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDi0kEoP2XPRK56yGscDMYb3lNds6AZJ7-DDv9aoX8tJ2c1YDkJEIfaeh9Wj5SqzUWt7P9E_W0yNPYrOrscfsoU-lJ3Yaz9CqhbkMk4UlnZfzq_aDjPYmTSXfu-PN84766arfMxIsd7gpPOhIag-S_cE3qyNtBbLmxjI7dau1dWSCTwdojgoRbgk_KC8_D9VKEWBf_0hA9KVEp4MuBNzeB8LO7Hdsm6gjO282LNYebwhBOZ99H9-K90_Q"/>
</div>

<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-gutter py-6">
<div class="max-w-2xl mx-auto bg-surface-container-lowest border border-outline-variant rounded-lg p-6 md:p-8">
<p class="font-body-lg text-body-lg text-on-surface-variant mb-6">Lengkapi formulir di bawah ini untuk mengajukan izin ketidakhadiran pada kegiatan organisasi.</p>
<form class="space-y-6">
<!-- Pilih Kegiatan -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface" for="kegiatan">Pilih Kegiatan</label>
<div class="relative">
<select class="block w-full min-h-[48px] px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-lg text-body-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary appearance-none cursor-pointer" id="kegiatan" name="kegiatan">
<option disabled="" selected="" value="">Pilih kegiatan yang akan datang...</option>
<option value="rapat_pleno">Rapat Pleno Bulanan - 24 Okt 2023</option>
<option value="diklat">Diklat Anggota Baru - 28 Okt 2023</option>
<option value="evaluasi">Evaluasi Program Kerja - 05 Nov 2023</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Alasan Tidak Hadir -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface" for="alasan">Alasan Tidak Hadir</label>
<textarea class="block w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-lg text-body-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary resize-y" id="alasan" name="alasan" placeholder="Jelaskan alasan ketidakhadiran Anda secara singkat dan jelas..." rows="4"></textarea>
</div>
<!-- Bukti Pendukung -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface">Bukti Pendukung (Opsional)</label>
<div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-outline-variant border-dashed rounded-lg bg-surface hover:bg-surface-container transition-colors cursor-pointer relative" id="file-upload-zone">
<div class="space-y-1 text-center">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2" data-icon="cloud_upload">cloud_upload</span>
<div class="flex text-sm text-on-surface-variant justify-center">
<label class="relative cursor-pointer rounded-md font-body-sm text-body-sm text-primary hover:text-primary-container focus-within:outline-none focus-within:ring-2 focus-within:ring-primary focus-within:ring-offset-2" for="file-upload">
<span>Pilih file PDF/JPG/PNG</span>
<input accept=".pdf,.jpg,.jpeg,.png" class="sr-only" id="file-upload" name="file-upload" type="file"/>
</label>

<script>
        // Simple file upload interaction
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name-display');
        const fileNameText = document.getElementById('file-name-text');
        const removeFileBtn = document.getElementById('remove-file');
        const dropZone = document.getElementById('file-upload-zone');

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                fileNameText.textContent = this.files[0].name;
                fileNameDisplay.classList.remove('hidden');
                fileNameDisplay.classList.add('flex');
            }
        });

        removeFileBtn.addEventListener('click', function() {
            fileInput.value = '';
            fileNameDisplay.classList.add('hidden');
            fileNameDisplay.classList.remove('flex');
        });

        // Basic drag and drop visual cues
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-primary', 'bg-surface-container-low');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-primary', 'bg-surface-container-low');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;

            if (files && files.length > 0) {
                fileInput.files = files;
                fileNameText.textContent = files[0].name;
                fileNameDisplay.classList.remove('hidden');
                fileNameDisplay.classList.add('flex');
            }
        }
    </script>
