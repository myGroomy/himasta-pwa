<style>
        body { font-family: 'Outfit', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 24px;
            height: 24px;
            background-color: #f7f9fb; /* Match body background */
            border-radius: 50%;
            border: 1px solid #c5c5d3; /* Match outline-variant */
            z-index: 10;
        }
        .ticket-cutout::before { left: -13px; border-right-color: transparent; border-top-color: transparent; border-bottom-color: transparent; transform: rotate(180deg); }
        .ticket-cutout::after { right: -13px; border-left-color: transparent; border-top-color: transparent; border-bottom-color: transparent; }
        
        /* Hide cutout borders that face inward to blend with background */
        .ticket-cutout-border-mask::before,
        .ticket-cutout-border-mask::after {
             content: '';
            position: absolute;
            top: -13px;
            width: 12px;
            height: 26px;
            background-color: #f7f9fb;
            z-index: 11;
        }
        .ticket-cutout-border-mask::before { left: -14px; }
        .ticket-cutout-border-mask::after { right: -14px; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-safe">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-14 transition-colors duration-200 ease-in-out">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container rounded-full p-2 transition-colors" data-icon="arrow_back">arrow_back</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Student Portal</span>
</div>
<span class="material-symbols-outlined text-secondary hover:bg-surface-container rounded-full p-2 transition-colors cursor-pointer" data-icon="account_circle">account_circle</span>
</header>
<!-- Main Content Canvas -->
<main class="pt-[72px] pb-[80px] px-margin-mobile md:px-gutter max-w-container-max mx-auto flex flex-col items-center justify-center min-h-[calc(100vh-16px)]">
<!-- Ticket Container -->
<div class="w-full max-w-sm bg-surface-container-lowest border border-outline-variant rounded-xl flex flex-col overflow-hidden shadow-sm mt-4">
<!-- Ticket Header -->
<div class="p-6 bg-primary-container text-on-primary-container flex flex-col items-center text-center">
<span class="material-symbols-outlined text-4xl mb-2" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-headline-md text-headline-md mb-1">Annual Tech Symposium 2024</h1>
<p class="font-body-sm text-body-sm opacity-90">VIP Admission</p>
</div>
<!-- Ticket Body -->
<div class="p-6 flex flex-col gap-4 border-b border-dashed border-outline-variant ticket-cutout ticket-cutout-border-mask relative bg-surface-container-lowest z-0">
<div class="flex justify-between items-start">
<div>
<p class="font-label-caps text-label-caps text-secondary uppercase">Participant</p>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">Alex Mercer</p>
</div>
<div class="text-right">
<p class="font-label-caps text-label-caps text-secondary uppercase">Ticket ID</p>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">#TS-9924-AB</p>
</div>
</div>
<div class="grid grid-cols-2 gap-4 mt-2">
<div>
<p class="font-label-caps text-label-caps text-secondary uppercase flex items-center gap-1"><span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span> Date</p>
<p class="font-body-sm text-body-sm text-on-surface mt-1">Oct 24, 2024</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-secondary uppercase flex items-center gap-1"><span class="material-symbols-outlined text-[16px]" data-icon="schedule">schedule</span> Time</p>
<p class="font-body-sm text-body-sm text-on-surface mt-1">09:00 AM - 05:00 PM</p>
</div>
<div class="col-span-2">
<p class="font-label-caps text-label-caps text-secondary uppercase flex items-center gap-1"><span class="material-symbols-outlined text-[16px]" data-icon="location_on">location_on</span> Venue</p>
<p class="font-body-sm text-body-sm text-on-surface mt-1">Main Auditorium, Campus Center</p>
</div>
</div>
</div>
<!-- QR Code Section -->
<div class="p-6 flex flex-col items-center justify-center bg-surface-container-lowest">
<div class="bg-white p-4 border border-outline-variant rounded-lg inline-block shadow-sm">

</div>
<p class="font-body-sm text-body-sm text-secondary mt-4 text-center">Scan at the entrance</p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-sm mt-6 flex gap-4">
<button class="flex-1 bg-surface-container-lowest border border-outline-variant text-primary font-body-lg text-body-lg rounded-lg h-touch-target-min flex items-center justify-center gap-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="share">share</span> Share
            </button>

<span class="material-symbols-outlined" data-icon="download">download</span> Save
