        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;

<body class="bg-background text-on-background min-h-screen font-body-lg flex flex-col md:flex-row">
<!-- Navigation Drawer (Desktop) / Hidden on Mobile due to transactional intent, but keeping structure if needed for broader app layout, though instruction says suppress nav shell for transactional. Wait, editing is transactional/task-focused. Suppressing Shell. -->
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-4 h-16 max-w-container-max mx-auto z-50">
<div class="flex items-center gap-4">
<button class="w-12 h-12 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Edit Pengumuman</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full pt-20 px-margin-mobile md:px-gutter max-w-3xl mx-auto pb-24">
<div class="bg-surface border border-outline-variant rounded-xl p-6 md:p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Judul -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="title">JUDUL PENGUMUMAN</label>
<input class="h-12 px-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg" id="title" name="title" type="text" value="Rapat Koordinasi Divisi"/>
</div>
<!-- Scope -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="scope">SCOPE PENGUMUMAN</label>
<div class="relative">
<select class="w-full h-12 px-3 appearance-none border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg" id="scope" name="scope">
<option value="global">Global</option>
<option selected="" value="divisi">Divisi</option>
<option value="pengurus">Pengurus Inti</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Kategori Divisi (Conditional based on Scope) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="divisi">PILIH DIVISI</label>
<div class="relative">
<select class="w-full h-12 px-3 appearance-none border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg" id="divisi" name="divisi">
<option value="ac">Acara</option>
<option selected="" value="pubdok">Publikasi &amp; Dokumentasi</option>
<option value="logistik">Logistik</option>
<option value="humas">Humas</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Content -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="content">KONTEN</label>
<textarea class="p-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg resize-y" id="content" name="content" rows="6">Harap hadir tepat waktu untuk membahas persiapan acara minggu depan. Siapkan laporan progress masing-masing PIC.</textarea>
</div>
<!-- Attachment (Optional) -->
<div class="flex flex-col gap-2 border border-outline-variant border-dashed rounded-lg p-6 flex items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant mb-2">upload_file</span>
<span class="font-body-sm text-on-surface-variant text-center">Ganti lampiran (Opsional) <br/> <span class="text-xs">Maksimal 5MB (PDF, JPG, PNG)</span></span>
<span class="mt-2 font-label-caps text-label-caps text-primary bg-primary-fixed px-3 py-1 rounded-full">rapat_agenda.pdf (Terlampir)</span>
</div>
<!-- Actions -->
<div class="pt-6 border-t border-outline-variant flex flex-col-reverse sm:flex-row gap-4 justify-end">
<button class="h-12 px-6 rounded-lg border border-outline-variant text-primary font-label-caps text-label-caps hover:bg-surface-variant transition-colors flex items-center justify-center" type="button">
                        Batal
                    </button>
<button class="h-12 px-6 rounded-lg bg-primary-container text-on-primary font-label-caps text-label-caps hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center" type="submit">
                        Simpan Perubahan
                    </button>
</div>
</form>
</div>
</main>
</body></html>
