<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Event Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "inverse-primary": "#b6c4ff",
                        "error-container": "#ffdad6",
                        "tertiary": "#4b1c00",
                        "on-primary-container": "#90a8ff",
                        "secondary-fixed": "#d3e4fe",
                        "outline": "#757682",
                        "on-background": "#191c1e",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb691",
                        "surface-tint": "#4059aa",
                        "primary-fixed": "#dce1ff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "secondary": "#505f76",
                        "inverse-on-surface": "#eff1f3",
                        "outline-variant": "#c5c5d3",
                        "secondary-container": "#d0e1fb",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "on-error": "#ffffff",
                        "primary-container": "#1e3a8a",
                        "on-tertiary-container": "#f39461",
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-tertiary-fixed": "#341100",
                        "on-surface-variant": "#444651",
                        "on-primary-fixed": "#00164e",
                        "primary": "#00236f",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-container": "#6e2c00",
                        "on-secondary-container": "#54647a",
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed": "#ffdbcb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "container-max": "1200px",
                        "margin-mobile": "1rem",
                        "gutter": "1rem"
                    },
                    "fontFamily": {
                        "body-lg": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-sm": ["Outfit"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen antialiased flex flex-col pt-14 pb-16">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flat no shadows">
<button class="text-primary dark:text-primary-fixed-dim p-2 flex items-center justify-center min-h-[48px] min-w-[48px] hover:bg-surface-container dark:hover:bg-on-surface-variant transition-colors duration-200 ease-in-out rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Event Check-in</h1>
<button class="text-primary dark:text-primary-fixed-dim p-2 flex items-center justify-center min-h-[48px] min-w-[48px] hover:bg-surface-container dark:hover:bg-on-surface-variant transition-colors duration-200 ease-in-out rounded-full opacity-0 pointer-events-none">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter max-w-container-max mx-auto w-full relative">
<!-- Scanner Area -->
<div class="relative w-full max-w-md aspect-square bg-black rounded-3xl overflow-hidden shadow-2xl mt-8">
<!-- Simulated Camera Feed -->
<img alt="Camera feed" class="w-full h-full object-cover opacity-80" data-alt="A blurred background view of a lively corporate event registration desk, professional lighting, minimal and clean, with a focus on depth of field simulating a camera viewfinder ready to scan a ticket." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPeTmFfNxH5RBxHO5NGyBM0n_3ZBTytj18RBxgUQwLJ1BHpWUP57hsZgUKvEFKNBoiJT1g29vMmxDa6WLTzrvjD7cj8l3shgZkuDxe7p5U-h6LFRsP37rWUfJDrj2qjD9sicGHvo_I-qTGdwrJGRBvZgZj2pJ6nPs9FrLUPSxdBetq0Fc5fynK4JXe3IyYPObLbm43Lq37enI4gvR1EmFPoDZ2ixLPZFLBIYmoBt6Y2hZZxOxcZdishw"/>
<!-- Scanning Overlay -->
<div class="absolute inset-0 flex items-center justify-center p-8">
<div class="relative w-full h-full">
<!-- Corner Markers -->
<div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-16 h-16 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-16 h-16 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Scanning Line -->
<div class="absolute top-1/2 left-0 w-full h-0.5 bg-primary shadow-[0_0_8px_2px_rgba(30,58,138,0.5)] animate-[scan_2s_ease-in-out_infinite]"></div>
</div>
</div>
<!-- Status Pill -->
<div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-surface/90 backdrop-blur-sm border border-outline-variant px-4 py-2 rounded-full flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="font-label-caps text-label-caps text-on-surface">Camera Active</span>
</div>
</div>
<!-- Instructions -->
<div class="mt-8 text-center space-y-4">
<h2 class="font-headline-md text-headline-md text-on-surface">Scan tiket masuk peserta</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mx-auto">
                Posisikan QR code tiket di dalam kotak untuk melakukan check-in otomatis.
            </p>
</div>
<!-- Manual Entry Option -->
<div class="mt-12 w-full max-w-md">
<div class="flex items-center gap-4 mb-4">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">ATAU</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<button class="w-full min-h-touch-target-min border border-outline-variant rounded-lg flex items-center justify-center gap-2 hover:border-primary hover:text-primary transition-colors bg-surface text-on-surface font-body-lg text-body-lg font-semibold">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
                Input ID Tiket Manual
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-gutter pb-safe bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-outline flat no shadows md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="info">info</span>
<span class="font-label-caps text-label-caps">About</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-3 py-1 scale-95 active:scale-90 transition-transform duration-150 min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="event" style="font-variation-settings: 'FILL' 1;">event</span>
<span class="font-label-caps text-label-caps">Events</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<style>
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
    </style>
</body></html>
