<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Student Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-primary-container": "#90a8ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdbcb",
                        "on-primary-fixed-variant": "#264191",
                        "on-primary-fixed": "#00164e",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#341100",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "primary-container": "#1e3a8a",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-tertiary-container": "#f39461",
                        "on-secondary-container": "#54647a",
                        "on-surface-variant": "#444651",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#505f76",
                        "outline-variant": "#c5c5d3",
                        "surface-tint": "#4059aa",
                        "on-surface": "#191c1e",
                        "error": "#ba1a1a",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-bright": "#f7f9fb",
                        "on-background": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#dce1ff",
                        "secondary-container": "#d0e1fb",
                        "tertiary": "#4b1c00",
                        "primary": "#00236f",
                        "background": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#b6c4ff",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#ffb691",
                        "on-error": "#ffffff",
                        "tertiary-container": "#6e2c00",
                        "outline": "#757682",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1rem",
                        "margin-mobile": "1rem",
                        "container-max": "1200px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "headline-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-gutter md:p-8 bg-surface">
<!-- Register Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant rounded-lg p-6 md:p-8 flex flex-col gap-6">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-2 mb-2">
<!-- Brand Icon Placeholder -->
<div class="w-12 h-12 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-3xl" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Buat Akun Baru</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Lengkapi data diri untuk mendaftar</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Nama Lengkap -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface" for="nama">NAMA LENGKAP</label>
<input class="h-touch-target-min w-full bg-surface border border-outline-variant rounded px-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="nama" name="nama" placeholder="Masukkan nama lengkap" type="text"/>
</div>
<!-- NIM -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface" for="nim">NIM</label>
<input class="h-touch-target-min w-full bg-surface border border-outline-variant rounded px-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="nim" name="nim" placeholder="Masukkan NIM Anda" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface" for="email">EMAIL</label>
<input class="h-touch-target-min w-full bg-surface border border-outline-variant rounded px-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" name="email" placeholder="contoh@mahasiswa.edu" type="email"/>
</div>
<!-- No. HP -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface" for="phone">NO. HP</label>
<input class="h-touch-target-min w-full bg-surface border border-outline-variant rounded px-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="phone" name="phone" placeholder="08xxxxxxxxxx" type="tel"/>
</div>
<!-- Divisi -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface" for="divisi">PILIHAN DIVISI</label>
<div class="relative">
<select class="appearance-none h-touch-target-min w-full bg-surface border border-outline-variant rounded pl-3 pr-10 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="divisi" name="divisi">
<option disabled="" selected="" value="">Pilih Divisi</option>
<option value="akademik">Akademik</option>
<option value="humas">Hubungan Masyarakat</option>
<option value="kreatif">Kreatif &amp; Desain</option>
<option value="sponsorship">Sponsorship</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5 mb-2">
<label class="font-label-caps text-label-caps text-on-surface" for="password">PASSWORD</label>
<div class="relative">
<input class="h-touch-target-min w-full bg-surface border border-outline-variant rounded pl-3 pr-10 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="password" name="password" placeholder="Buat password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-[12px] text-on-surface-variant mt-1">Minimal 8 karakter.</p>
</div>
<!-- Submit Button -->
<button class="h-touch-target-min w-full bg-primary-container text-on-primary font-headline-md text-headline-md rounded flex items-center justify-center hover:bg-surface-tint transition-colors mt-2" type="submit">
                Buat Akun
            </button>
</form>
<!-- Footer Link -->
<div class="text-center mt-2 border-t border-outline-variant pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Sudah punya akun? 
                <a class="text-primary font-semibold hover:underline" href="/login">Masuk di sini</a>
</p>
</div>
</main>
</body></html>
