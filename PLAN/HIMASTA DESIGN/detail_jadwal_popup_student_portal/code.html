<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detail Jadwal Popup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed": "#ffdbcb",
                        "primary-container": "#1e3a8a",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "outline-variant": "#c5c5d3",
                        "surface-tint": "#4059aa",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "primary": "#00236f",
                        "on-surface": "#191c1e",
                        "on-primary-fixed-variant": "#264191",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#773205",
                        "secondary": "#505f76",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed": "#0b1c30",
                        "primary-fixed": "#dce1ff",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary": "#4b1c00",
                        "surface-bright": "#f7f9fb",
                        "tertiary-container": "#6e2c00",
                        "outline": "#757682",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#444651",
                        "on-tertiary-container": "#f39461",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#90a8ff",
                        "surface": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed": "#00164e",
                        "on-secondary-container": "#54647a",
                        "inverse-surface": "#2d3133",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed-dim": "#ffb691",
                        "surface-container": "#eceef0",
                        "primary-fixed-dim": "#b6c4ff",
                        "secondary-container": "#d0e1fb",
                        "on-tertiary-fixed": "#341100",
                        "inverse-primary": "#b6c4ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-background": "#191c1e",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "1rem",
                        "gutter": "1rem",
                        "touch-target-min": "48px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-md": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "body-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen w-screen overflow-hidden flex items-center justify-center relative font-body-lg text-body-lg">
<!-- Mock Background Content to show context -->
<div class="absolute inset-0 z-0 flex flex-col p-4 opacity-50 blur-sm pointer-events-none">
<div class="h-16 w-full bg-surface-container rounded-lg mb-4"></div>
<div class="flex-1 grid grid-cols-2 gap-4">
<div class="bg-surface-container rounded-lg h-32"></div>
<div class="bg-surface-container rounded-lg h-32"></div>
<div class="bg-surface-container rounded-lg h-32 col-span-2"></div>
</div>
</div>
<!-- Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity duration-300" id="modal-backdrop"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-50 w-full max-w-sm mx-4 bg-surface-bright rounded-lg shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)] border border-outline-variant flex flex-col transform transition-all duration-300 scale-100 opacity-100" id="event-modal" role="dialog">
<!-- Header -->
<div class="flex justify-between items-center p-4 border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-on-surface" id="modal-title">Detail Jadwal</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors p-1" onclick="closeModal()">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Body -->
<div class="p-6 flex flex-col gap-4">
<div class="flex flex-col gap-1">
<h3 class="font-headline-md text-headline-md text-primary">Executive Board Meeting</h3>
<div class="flex items-center mt-1">
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-caps text-label-caps border border-secondary-fixed">
                        Akademik
                    </span>
</div>
</div>
<div class="flex items-start gap-3 mt-2">
<span class="material-symbols-outlined text-secondary mt-0.5" style="font-variation-settings: 'FILL' 1;">schedule</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Waktu</span>
<span class="font-body-lg text-body-lg text-on-surface">10:00 AM - 11:30 AM</span>
</div>
</div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-secondary mt-0.5" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Lokasi</span>
<span class="font-body-lg text-body-lg text-on-surface">Room 302</span>
</div>
</div>
<div class="mt-2">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1 block">Deskripsi</span>
<p class="font-body-sm text-body-sm text-on-surface bg-surface-container-lowest p-3 rounded border border-outline-variant">
                    Pembahasan agenda proker bulanan dan evaluasi kinerja divisi.
                </p>
</div>
</div>
<!-- Footer / Actions -->
<div class="p-4 border-t border-outline-variant flex gap-3 justify-end bg-surface">
<button class="min-h-[48px] px-6 rounded flex items-center justify-center font-label-caps text-label-caps border border-outline-variant text-primary hover:border-primary hover:bg-surface-variant transition-colors" onclick="closeModal()">
                Tutup
            </button>
<button class="min-h-[48px] px-6 rounded flex items-center justify-center font-label-caps text-label-caps bg-primary-container text-on-primary hover:bg-primary transition-colors shadow-sm">
<span class="material-symbols-outlined mr-2 text-[18px]">notifications_active</span>
                Ingatkan Saya
            </button>
</div>
</div>
<script>
        function closeModal() {
            const modal = document.getElementById('event-modal');
            const backdrop = document.getElementById('modal-backdrop');
            
            modal.classList.remove('scale-100', 'opacity-100');
            modal.classList.add('scale-95', 'opacity-0');
            
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            
            setTimeout(() => {
                // In a real app, this would remove or hide the DOM element completely
                // For this preview, we'll just fade it back in after a moment to keep it visible
                setTimeout(() => {
                    modal.classList.remove('scale-95', 'opacity-0');
                    modal.classList.add('scale-100', 'opacity-100');
                    backdrop.classList.remove('opacity-0');
                    backdrop.classList.add('opacity-100');
                }, 1000);
            }, 300);
        }
    </script>
</body></html>
