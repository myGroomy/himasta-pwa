<style>
        /* Minimal custom styles for the toggle switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #1e3a8a; /* primary-container */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #1e3a8a; /* primary-container */
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: #ffffff;
        }
        .toggle-label {
            width: 44px;
            height: 24px;
            background-color: #e0e3e5; /* surface-variant */
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.2s ease-in-out;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-lg antialiased min-h-screen flex flex-col">
<!-- TopAppBar Shared Component -->
<!-- Applying style_component_shape, style_bg_color, style_separation_logic -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50">
<!-- Applying style_shell_layout -->
<div class="flex justify-between items-center px-4 h-16 w-full max-w-container-max mx-auto">
<!-- Leading Icon (Back Button) -->
<button aria-label="Go back" class="h-touch-target-min w-12 flex items-center justify-start text-on-surface-variant hover:bg-surface-container transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Headline -->
<!-- Applying style_brand_logo -->
<div class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center">
                StudentOrg Portal
            </div>
<!-- Trailing Avatar -->
<div class="h-touch-target-min w-12 flex items-center justify-end">
<img alt="User profile photo" class="w-8 h-8 rounded-full border border-outline-variant object-cover" data-alt="A small, professional portrait photo of a university student looking confident and approachable, set against a clean, minimalist light gray background to match a corporate UI aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAB36Zu-8aeK7nbf2P2QGJ-e267hVUH-DsQaWZLd2mybaRbeptxPejpATkcdz4pAH_KyjL3qD4kwBLmOANyw3B9gFYYNs3_wTDBAw7HlPn8UYJHuBR35xWy18BkAZfYkY4lNqc3D5gwAZHOXOBahx7TkV9E8u9XCAmMitOR-8XGprWcl3Oh4BRVjvBXtxm6vtgBFE0-fYWyzKgsJ9doZiGnaeq6QhTFg3R9eButf8IvEX6795kLAsaHKQ"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile py-6 flex flex-col gap-6 md:w-[600px] md:mx-auto">
<!-- Page Header -->
<section class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                Kritik &amp; Saran
            </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Suara Anda membantu organisasi menjadi lebih baik. Sampaikan kritik, saran, atau aspirasi Anda secara anonim atau terbuka.
            </p>
</section>
<!-- Feedback Form inside a minimalist card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 flex flex-col gap-6">
<!-- Anonymous Toggle -->
<div class="flex items-center justify-between border-b border-surface-variant pb-4">
<label class="font-body-lg text-body-lg text-on-surface cursor-pointer select-none" for="anonymous-toggle">
                    Kirim secara Anonim
                </label>
<div class="relative inline-block w-11 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0 z-10" id="anonymous-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="anonymous-toggle"></label>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Subject Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="subject">
                        Subjek Feedback
                    </label>
<input class="h-touch-target-min w-full bg-transparent border border-outline-variant rounded px-3 text-on-surface font-body-lg focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="subject" name="subject" placeholder="Misal: Fasilitas Ruang BEM" required="" type="text"/>
</div>
<!-- Textarea -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="message">
                        Isi Kritik &amp; Saran
                    </label>
<textarea class="w-full min-h-[160px] bg-transparent border border-outline-variant rounded p-3 text-on-surface font-body-lg focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all resize-none" id="message" name="message" placeholder="Tuliskan detail kritik atau saran Anda di sini..." required=""></textarea>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-touch-target-min bg-primary-container text-white rounded font-headline-md text-headline-md flex items-center justify-center transition-colors hover:bg-primary hover:shadow-sm active:scale-[0.98]" type="submit">
                        Kirim Feedback
                    </button>
</div>
</form>
</section>
</main>
<!-- BottomNavBar is suppressed based on the rule for task-focused/linear pages with a 'Back' action -->
</body></html>
