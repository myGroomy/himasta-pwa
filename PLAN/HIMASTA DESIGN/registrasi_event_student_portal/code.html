<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Halaman Registrasi Event</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "inverse-primary": "#b6c4ff",
                        "error-container": "#ffdad6",
                        "tertiary": "#4b1c00",
                        "on-primary-container": "#90a8ff",
                        "secondary-fixed": "#d3e4fe",
                        "outline": "#757682",
                        "on-background": "#191c1e",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb691",
                        "surface-tint": "#4059aa",
                        "primary-fixed": "#dce1ff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "secondary": "#505f76",
                        "inverse-on-surface": "#eff1f3",
                        "outline-variant": "#c5c5d3",
                        "secondary-container": "#d0e1fb",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "on-error": "#ffffff",
                        "primary-container": "#1e3a8a",
                        "on-tertiary-container": "#f39461",
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-tertiary-fixed": "#341100",
                        "on-surface-variant": "#444651",
                        "on-primary-fixed": "#00164e",
                        "primary": "#00236f",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-container": "#6e2c00",
                        "on-secondary-container": "#54647a",
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed": "#ffdbcb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "container-max": "1200px",
                        "margin-mobile": "1rem",
                        "gutter": "1rem"
                    },
                    "fontFamily": {
                        "body-lg": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-sm": ["Outfit"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col justify-center items-center p-margin-mobile">
<!-- Main Registration Container -->
<main class="w-full max-w-[600px] bg-surface rounded-xl border border-outline-variant p-6 md:p-8 flex flex-col gap-8 shadow-sm">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-2">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined" data-icon="event" style="font-size: 32px;">event</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Registrasi Event</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Silakan lengkapi formulir di bawah ini untuk mendaftar pada acara tersebut.</p>
</header>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Nama Lengkap -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="namaLengkap">Nama Lengkap</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-touch-target-min pl-10 pr-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="namaLengkap" name="namaLengkap" placeholder="Masukkan nama lengkap Anda" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-touch-target-min pl-10 pr-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" placeholder="alamat@email.com" required="" type="email"/>
</div>
</div>
<!-- Instansi -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="instansi">Instansi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="apartment">apartment</span>
<input class="w-full h-touch-target-min pl-10 pr-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="instansi" name="instansi" placeholder="Organisasi atau Institusi Anda" required="" type="text"/>
</div>
</div>
<!-- No HP -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="noHp">No HP</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="phone">phone</span>
<input class="w-full h-touch-target-min pl-10 pr-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="noHp" name="noHp" placeholder="+62 8xx xxxx xxxx" required="" type="tel"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min bg-primary-container text-on-primary rounded-lg font-headline-md text-headline-md mt-4 hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
<span>Daftar Sekarang</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Note -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">Dengan mendaftar, Anda menyetujui syarat &amp; ketentuan kami.</p>
</div>
</main>
</body></html>
