<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Buat Proker Baru</title>
<!-- Google Fonts: Outfit -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c5c5d3",

                    "surface": "#f7f9fb",
                    "surface-container-high": "#e6e8ea",

                    "surface-dim": "#d8dadc",
                    "primary-container": "#1e3a8a",
                    "on-surface": "#191c1e",
                    "inverse-primary": "#b6c4ff",
                    "on-primary-container": "#90a8ff",
                    "outline": "#757682",
                    "on-primary-fixed-variant": "#264191",
                    "primary": "#00236f",
                    "on-secondary-fixed-variant": "#38485d",
                    "primary-fixed-dim": "#b6c4ff",
                    "surface-variant": "#e0e3e5",
                    "surface-tint": "#4059aa",
                    "secondary-container": "#d0e1fb",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#dce1ff",
                    "on-secondary-container": "#54647a",
                    "tertiary-fixed-dim": "#ffb691",
                    "surface-container-low": "#f2f4f6",
                    "on-primary": "#ffffff",
                    "tertiary-container": "#6e2c00",
                    "surface-container": "#eceef0",
                    "on-primary-fixed": "#00164e",
                    "tertiary": "#4b1c00",
                    "on-tertiary-fixed-variant": "#773205",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#f39461",
                    "on-secondary-fixed": "#0b1c30",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#b7c8e1",
                    "inverse-on-surface": "#eff1f3",
                    "background": "#f7f9fb",
                    "tertiary-fixed": "#ffdbcb",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary-fixed": "#341100",
                    "on-error": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "secondary": "#505f76",
                    "on-surface-variant": "#444651",
                    "secondary-fixed": "#d3e4fe",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "1rem",
                    "container-max": "1200px",
                    "touch-target-min": "48px",
                    "gutter": "1rem"
            },
            "fontFamily": {
                    "headline-md": ["Outfit"],
                    "body-sm": ["Outfit"],
                    "label-caps": ["Outfit"],
                    "headline-lg": ["Outfit"],
                    "headline-lg-mobile": ["Outfit"],

            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #c5c5d3;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-surface text-on-background antialiased min-h-screen flex flex-col">
<!-- Transactional Header (Replaces Nav Shell as per rules for focused tasks) -->
<header class="fixed top-0 left-0 w-full h-touch-target-min bg-surface border-b border-outline-variant flex items-center px-margin-mobile z-40">
<div class="w-full max-w-container-max mx-auto flex items-center">
<button aria-label="Kembali" class="h-10 w-10 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface-variant" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background ml-2">Buat Proker Baru</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(48px+1rem)] pb-[calc(48px+2rem)] px-margin-mobile md:py-[calc(48px+2rem)] w-full max-w-[800px] mx-auto">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile md:p-6 shadow-sm shadow-black/5">
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Nama Proker -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="nama_proker">Nama Proker</label>
<input class="w-full h-touch-target-min px-3 bg-surface border border-outline-variant rounded font-body-lg text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="nama_proker" name="nama_proker" placeholder="Contoh: Orientasi Mahasiswa Baru" type="text"/>
</div>
<!-- Deskripsi -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="deskripsi">Deskripsi Kegiatan</label>
<textarea class="w-full p-3 bg-surface border border-outline-variant rounded font-body-lg text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-y min-h-[120px]" id="deskripsi" name="deskripsi" placeholder="Jelaskan tujuan dan ruang lingkup program kerja ini..." rows="4"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Estimasi Budget -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="budget">Estimasi Budget</label>
<div class="flex w-full h-touch-target-min border border-outline-variant rounded bg-surface overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<span class="flex items-center justify-center px-4 bg-surface-container-low border-r border-outline-variant font-body-sm text-on-surface-variant font-medium">
                                Rp
                            </span>
<input class="flex-1 w-full px-3 bg-transparent font-body-lg text-on-background placeholder:text-outline focus:outline-none border-none ring-0" id="budget" min="0" name="budget" placeholder="0" step="1000" type="number"/>
</div>
</div>
<!-- Pilihan Divisi -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="divisi">Divisi Pelaksana</label>
<div class="relative w-full h-touch-target-min">
<select class="w-full h-full px-3 pr-10 bg-surface border border-outline-variant rounded font-body-lg text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow appearance-none cursor-pointer" id="divisi" name="divisi">
<option disabled="" hidden="" selected="" value="">Pilih Divisi...</option>
<option value="humas">Hubungan Masyarakat</option>
<option value="psdm">Pengembangan SDM</option>
<option value="rismek">Riset dan Mekanika</option>
<option value="kestari">Kesekretariatan</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
                                expand_more
                            </span>
</div>
</div>
</div>
<!-- Tanggal Rencana -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="tanggal">Tanggal Rencana Pelaksanaan</label>
<div class="relative w-full md:w-1/2 h-touch-target-min">
<input class="w-full h-full px-3 bg-surface border border-outline-variant rounded font-body-lg text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow cursor-pointer" id="tanggal" name="tanggal" type="date"/>
</div>
</div>
<!-- Desktop Submit (Hidden on Mobile) -->
<div class="hidden md:flex justify-end pt-6 mt-2 border-t border-outline-variant">
<button class="h-touch-target-min px-8 bg-primary-container text-on-primary font-body-sm font-semibold tracking-wide rounded hover:bg-primary transition-colors active:scale-95 flex items-center gap-2" type="submit">
                        Buat Proker
                        <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</form>
</div>
</main>
<!-- Mobile Fixed Bottom Action Area -->
<div class="md:hidden fixed bottom-0 left-0 w-full p-margin-mobile bg-surface border-t border-outline-variant z-40">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-body-sm font-semibold tracking-wide rounded hover:bg-primary transition-colors active:scale-95 flex items-center justify-center gap-2 shadow-sm" onclick="document.querySelector('form').dispatchEvent(new Event('submit'))" type="submit">
            Buat Proker
        </button>
</div>
</body></html>
