<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Buat Pengumuman Baru - StudentOrg Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#38485d",
                        "on-surface": "#191c1e",
                        "primary-container": "#1e3a8a",
                        "on-secondary-container": "#54647a",
                        "on-primary-fixed-variant": "#264191",
                        "tertiary-fixed-dim": "#ffb691",
                        "secondary": "#505f76",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#0b1c30",
                        "background": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#773205",
                        "on-surface-variant": "#444651",
                        "secondary-container": "#d0e1fb",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e0e3e5",
                        "surface-tint": "#4059aa",
                        "tertiary-fixed": "#ffdbcb",
                        "surface-container": "#eceef0",
                        "inverse-surface": "#2d3133",
                        "surface": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-container": "#90a8ff",
                        "on-primary": "#ffffff",
                        "outline": "#757682",
                        "on-primary-fixed": "#00164e",
                        "inverse-primary": "#b6c4ff",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c5c5d3",
                        "surface-variant": "#e0e3e5",
                        "primary-fixed": "#dce1ff",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed": "#341100",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d8dadc",
                        "primary": "#00236f",
                        "secondary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#f39461",
                        "tertiary-container": "#6e2c00",
                        "tertiary": "#4b1c00",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "margin-mobile": "1rem",
                        "gutter": "1rem",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-md": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "label-caps": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "body-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[style*="'FILL' 1"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-lg">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed border-b border-outline-variant dark:border-outline fixed top-0 w-full z-50">
<div class="flex items-center justify-between px-4 h-16 w-full max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<button aria-label="Back" class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">StudentOrg Portal</h1>
</div>
<button aria-label="Search" class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">search</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 px-margin-mobile md:px-gutter max-w-3xl mx-auto w-full">
<div class="py-6">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Buat Pengumuman Baru</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Buat dan publikasikan informasi penting untuk anggota atau divisi.</p>
</div>
<form class="space-y-6 bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:p-6">
<!-- Judul Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="title">Judul Pengumuman</label>
<input class="h-touch-target-min px-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="title" name="title" placeholder="Masukkan judul..." type="text"/>
</div>
<!-- Grid for Scope & Visibility -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Scope Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="scope">Scope</label>
<div class="relative">
<select class="appearance-none w-full h-touch-target-min px-3 pr-10 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="scope" name="scope">
<option value="general">General</option>
<option value="divisi">Divisi Khusus</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Visibilitas Dosen Toggle -->
<div class="flex flex-col gap-2 justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Visibilitas Dosen</span>
<label class="flex items-center cursor-pointer min-h-[48px]">
<div class="relative">
<input class="sr-only peer" name="dosen_visibility" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary-container rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
<span class="ms-3 font-body-sm text-body-sm text-on-surface">Tampilkan untuk Dosen Pembimbing</span>
</label>
</div>
</div>
<!-- Rich Text Editor Area -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="content">Isi Pengumuman</label>
<div class="border border-outline-variant rounded-lg overflow-hidden bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors">
<!-- Fake Toolbar -->
<div class="bg-surface-container flex items-center gap-1 p-1 border-b border-outline-variant">
<button aria-label="Bold" class="w-10 h-10 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">format_bold</span>
</button>
<button aria-label="Italic" class="w-10 h-10 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">format_italic</span>
</button>
<button aria-label="Underline" class="w-10 h-10 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">format_underlined</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<button aria-label="List" class="w-10 h-10 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">format_list_bulleted</span>
</button>
<button aria-label="Link" class="w-10 h-10 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">link</span>
</button>
</div>
<textarea class="w-full p-3 bg-transparent border-none font-body-lg text-body-lg text-on-surface resize-y focus:outline-none focus:ring-0" id="content" name="content" placeholder="Tulis pengumuman di sini..." rows="8"></textarea>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col sm:flex-row gap-4 justify-end border-t border-outline-variant">
<button class="h-touch-target-min px-6 border border-outline text-primary bg-transparent hover:bg-surface-variant/50 rounded-lg font-label-caps text-label-caps uppercase transition-colors flex items-center justify-center" type="button">
                    Simpan Draf
                </button>
<button class="h-touch-target-min px-6 bg-primary-container text-on-primary rounded-lg font-label-caps text-label-caps uppercase hover:bg-primary transition-colors flex items-center justify-center" type="submit">
                    Publikasikan
                </button>
</div>
</form>
</main>
</body></html>
